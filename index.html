const CUSTOM={
'Крем-брюле эспрессо мартини':{ru:['Охладите купе: наполните его льдом или поставьте в морозилку на 5–10 минут.','Сварите эспрессо и дайте ему немного остыть.','Налейте в шейкер: ванильную водку 45 мл, кофейный ликёр 30 мл, эспрессо 30 мл, жирные сливки 30 мл, Butterscotch шнапс 15 мл и яичный белок.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Процедите в другую половину шейкера, уберите лёд и встряхните ещё 10 секунд без льда (реверс-шейк) — так пена станет плотной и гладкой.','Вылейте лёд из купе и перелейте коктейль. Дайте пене подняться 20–30 секунд.','Равномерно посыпьте пену тонким слоем коричневого сахара.','Карамелизируйте сахар кухонной горелкой, держа её в 5–7 см от поверхности, до золотистой корочки. Подавайте сразу.'],en:['Chill the coupe: fill it with ice or put it in the freezer for 5–10 minutes.','Brew an espresso and let it cool slightly.','Pour into the shaker: vanilla vodka 45 ml, coffee liqueur 30 ml, espresso 30 ml, heavy cream 30 ml, butterscotch schnapps 15 ml and the egg white.','Fill the shaker with ice and shake hard for 12–15 seconds.','Strain into the other half of the shaker, discard the ice and shake again without ice for 10 seconds (reverse dry shake) for a dense, silky foam.','Discard the ice from the coupe and pour in the cocktail. Let the foam settle for 20–30 seconds.','Sprinkle an even, thin layer of brown sugar over the foam.','Caramelise the sugar with a kitchen torch held 5–7 cm away until golden. Serve straight away.']},
'Апероль шприц':{ru:['Наполните винный бокал льдом доверху.','Налейте игристое вино ~100 мл.','Добавьте апероль 40 мл — он тяжелее и сам начнёт смешиваться с вином.','Долейте газированную воду 20–30 мл.','Один раз аккуратно перемешайте барной ложкой снизу вверх, чтобы не выпустить газ.','Украсьте долькой апельсина или грейпфрута и подавайте.'],en:['Fill a wine glass to the top with ice.','Pour in about 100 ml of sparkling wine.','Add 40 ml of Aperol — it is heavier and will start mixing with the wine on its own.','Top with 20–30 ml of sparkling water.','Stir gently once from bottom to top with a bar spoon so you keep the bubbles.','Garnish with an orange or grapefruit slice and serve.']},
'Blowjob':{ru:['Возьмите стопку (шот) и барную ложку.','Налейте на дно кофейный ликёр — примерно треть стопки.','Приложите барную ложку выпуклой стороной вверх к стенке стопки над ликёром и очень медленно налейте по ней Бейлис — он ляжет вторым слоем.','Сверху выложите шапку взбитых сливок.','Классическая подача — выпить залпом без помощи рук.'],en:['Take a shot glass and a bar spoon.','Pour coffee liqueur into the bottom — about a third of the glass.','Hold the bar spoon, back side up, against the inside of the glass just above the liqueur and very slowly pour Baileys over it so it settles as a second layer.','Top with a cap of whipped cream.','Traditionally it is drunk in one go, hands-free.']},
'Bee’s knees':{ru:['Охладите коктейльную рюмку: наполните её льдом или поставьте в морозилку на 5–10 минут.','Налейте в шейкер мёд (2 ч. л. медового сиропа), лимонный сок 30 мл и апельсиновый сок 30 мл.','Размешайте барной ложкой, пока мёд полностью не растворится в соке.','Добавьте сухой джин 60 мл.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Вылейте лёд из рюмки и процедите коктейль двойной фильтрацией.','Украсьте цедрой лимона и подавайте.'],en:['Chill the cocktail glass: fill it with ice or put it in the freezer for 5–10 minutes.','Pour the honey (2 tsp honey syrup), 30 ml lemon juice and 30 ml orange juice into the shaker.','Stir with a bar spoon until the honey has fully dissolved.','Add 60 ml of dry gin.','Fill the shaker with ice and shake hard for 12–15 seconds.','Discard the ice from the glass and double strain the cocktail into it.','Garnish with a lemon twist and serve.']},
'Дайкири':{ru:['Охладите бокал для коктейля: наполните его льдом или поставьте в морозилку на 5–10 минут.','Насыпьте в шейкер сахар (2 ч. л.) и налейте сок лайма 20 мл.','Размешайте барной ложкой, пока сахар полностью не растворится.','Добавьте светлый ром 60 мл.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Вылейте лёд из бокала и процедите коктейль двойной фильтрацией.','Украсьте долькой лайма и подавайте сразу.'],en:['Chill a cocktail glass: fill it with ice or put it in the freezer for 5–10 minutes.','Put 2 tsp of sugar into the shaker and add 20 ml of lime juice.','Stir with a bar spoon until the sugar has fully dissolved.','Add 60 ml of light rum.','Fill the shaker with ice and shake hard for 12–15 seconds.','Discard the ice from the glass and double strain the cocktail into it.','Garnish with a lime wedge and serve straight away.']},
'Горячий тодди':{ru:['Прогрейте два термостойких бокала или кружки, ополоснув их кипятком.','Смешайте виски 50 мл с мёдом (3 ч. л.) до растворения мёда.','Разлейте смесь поровну в два бокала.','В каждый бокал положите по половине палочки корицы и по бутону гвоздики.','Налейте кипяток — по 100 мл в каждый бокал — и перемешайте.','Добавьте по несколько капель лимонного сока (всего 5 мл).','Украсьте ломтиками лимона и подавайте горячим.'],en:['Warm two heatproof glasses or mugs by rinsing them with boiling water.','Mix 50 ml of whisky with 3 tsp of honey until the honey dissolves.','Divide the mixture between the two glasses.','Put half a cinnamon stick and one clove into each glass.','Pour 100 ml of boiling water into each glass and stir.','Add a few drops of lemon juice to each (5 ml in total).','Garnish with lemon slices and serve hot.']},
'Огуречный лимонад':{ru:['Снимите цедру с лимона и выжмите из него сок.','Положите в сотейник цедру лимона, половину мяты и сахарный сироп 200 мл, доведите до кипения и сразу снимите с огня. Дайте остыть.','Натрите или измельчите в блендере 200 г огурцов и отожмите сок через сито.','Смешайте огуречный и лимонный сок с остывшим сиропом.','Процедите смесь в кувшин через сито.','Нарежьте дольками оставшиеся огурцы и лайм, добавьте в кувшин вместе с остальной мятой.','Долейте 1 л холодной воды, перемешайте и уберите в холодильник минимум на 30 минут.','Подавайте в стаканах со льдом.'],en:['Zest the lemon and squeeze its juice.','Put the lemon zest, half the mint and 200 ml of simple syrup into a saucepan, bring to the boil and take it off the heat right away. Let it cool.','Grate or blend 200 g of cucumbers and press the juice through a sieve.','Mix the cucumber and lemon juice with the cooled syrup.','Strain the mixture into a pitcher through a sieve.','Slice the remaining cucumbers and the lime and add them to the pitcher with the rest of the mint.','Top up with 1 l of cold water, stir and chill for at least 30 minutes.','Serve in glasses over ice.']},
'Белый русский':{ru:['Наполните рокс льдом.','Налейте водку 50 мл и кофейный ликёр 20 мл, перемешайте барной ложкой.','Медленно налейте сверху сливки 30 мл по барной ложке, чтобы они легли слоем.','Подавайте как есть или слегка перемешайте перед тем, как пить.'],en:['Fill a rocks glass with ice.','Pour in 50 ml of vodka and 20 ml of coffee liqueur and stir with a bar spoon.','Slowly float 30 ml of cream on top over the back of a bar spoon so it forms a layer.','Serve as is, or give it a gentle stir before drinking.']},
'Тёмный и бурный':{ru:['Наполните хайбол льдом доверху.','Налейте имбирное пиво 100 мл и сок лайма 10 мл.','Медленно налейте сверху тёмный ром 60 мл по барной ложке — он останется тёмным «грозовым» слоем.','Не перемешивайте. Украсьте долькой лайма и подавайте.'],en:['Fill a highball to the top with ice.','Pour in 100 ml of ginger beer and 10 ml of lime juice.','Slowly float 60 ml of dark rum on top over the back of a bar spoon so it stays as a dark “stormy” layer.','Do not stir. Garnish with a lime wedge and serve.']},
'Текила санрайз':{ru:['Наполните хайбол льдом доверху.','Налейте текилу 45 мл и апельсиновый сок 90 мл, перемешайте.','Медленно влейте гренадин 15 мл по стенке бокала — он опустится на дно и даст эффект рассвета.','Не перемешивайте. Украсьте долькой апельсина и вишней.'],en:['Fill a highball to the top with ice.','Pour in 45 ml of tequila and 90 ml of orange juice and stir.','Slowly pour 15 ml of grenadine down the inside of the glass — it sinks to the bottom and creates the sunrise effect.','Do not stir. Garnish with an orange slice and a cherry.']},
'Пеницилин':{ru:['Наполните рокс льдом.','Налейте в шейкер: купажированный скотч 60 мл, лимонный сок 22 мл, медово-имбирный сироп 22 мл.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Процедите коктейль в рокс со льдом.','Медленно налейте сверху дымный скотч 7 мл по барной ложке — он даст аромат дыма в первом глотке.','Украсьте засахаренным имбирём или цедрой лимона.'],en:['Fill a rocks glass with ice.','Pour into the shaker: blended Scotch 60 ml, lemon juice 22 ml, honey-ginger syrup 22 ml.','Fill the shaker with ice and shake hard for 12–15 seconds.','Strain the cocktail into the rocks glass over ice.','Slowly float 7 ml of smoky Scotch on top over the back of a bar spoon for a smoky first sip.','Garnish with candied ginger or a lemon twist.']},
'Ирландский кофе':{ru:['Прогрейте ирландский бокал, ополоснув его кипятком.','Слегка взбейте сливки 30 мл венчиком до густоты жидкой сметаны.','Положите в бокал коричневый сахар (1 ч. л.) и налейте горячий кофе 90 мл, размешайте до растворения.','Добавьте ирландский виски 40 мл и перемешайте.','По барной ложке аккуратно выложите сливки сверху слоем 1–1,5 см.','Не перемешивайте — кофе пьют через сливки. Подавайте сразу.'],en:['Warm an Irish coffee glass by rinsing it with boiling water.','Lightly whip 30 ml of cream until it is thick but still pourable.','Put 1 tsp of brown sugar into the glass, add 90 ml of hot coffee and stir until dissolved.','Add 40 ml of Irish whiskey and stir.','Float the cream on top over the back of a bar spoon in a 1–1.5 cm layer.','Do not stir — the coffee is sipped through the cream. Serve straight away.']},
'Сангрия':{ru:['Нарежьте апельсин и яблоко небольшими дольками.','Положите фрукты в кувшин и засыпьте сахаром (2 ст. л.), дайте постоять 5 минут.','Влейте красное вино 750 мл, бренди 60 мл и апельсиновый ликёр 30 мл, перемешайте.','Уберите кувшин в холодильник на 2–4 часа, чтобы фрукты отдали аромат.','Перед подачей добавьте лёд и содовую 200 мл, аккуратно перемешайте.','Разливайте по бокалам вместе с фруктами.'],en:['Cut the orange and apple into small pieces.','Put the fruit into a pitcher, sprinkle with 2 tbsp of sugar and leave for 5 minutes.','Pour in 750 ml of red wine, 60 ml of brandy and 30 ml of orange liqueur and stir.','Chill the pitcher for 2–4 hours so the fruit can infuse.','Just before serving add ice and 200 ml of soda water and stir gently.','Pour into glasses together with the fruit.']},
'Глинтвейн':{ru:['Нарежьте апельсин кружками.','Налейте красное вино 750 мл в кастрюлю, добавьте мёд (3 ст. л.), корицу, гвоздику, бадьян и апельсин.','Нагревайте на среднем огне, помешивая, до 70–75 °C — появится пар, но не пузыри. Не доводите до кипения.','Снимите с огня, накройте крышкой и дайте настояться 10 минут.','Процедите и разлейте по прогретым кружкам или термостойким бокалам.'],en:['Slice the orange into rounds.','Pour 750 ml of red wine into a pan and add 3 tbsp of honey, the cinnamon, cloves, star anise and orange.','Heat over medium heat, stirring, to 70–75 °C — it should steam but not bubble. Do not let it boil.','Take it off the heat, cover and let it infuse for 10 minutes.','Strain and pour into warmed mugs or heatproof glasses.']},
'Хьюго':{ru:['Положите в винный бокал несколько листьев мяты и дольку лайма, слегка надавите на них ложкой.','Наполните бокал льдом.','Налейте бузинный ликёр 20 мл.','Долейте просекко 100 мл и содовую 30 мл.','Аккуратно перемешайте барной ложкой и украсьте веточкой мяты.'],en:['Put a few mint leaves and a lime wedge into a wine glass and press them lightly with a spoon.','Fill the glass with ice.','Pour in 20 ml of elderflower liqueur.','Top with 100 ml of prosecco and 30 ml of soda water.','Stir gently with a bar spoon and garnish with a mint sprig.']},
'Ширли Темпл':{ru:['Наполните хайбол льдом доверху.','Налейте имбирный эль 150 мл и сок лайма 10 мл.','Медленно влейте сверху гренадин 15 мл — он красиво опустится вниз.','Украсьте коктейльной вишней.'],en:['Fill a highball to the top with ice.','Pour in 150 ml of ginger ale and 10 ml of lime juice.','Slowly pour 15 ml of grenadine on top — it will sink down beautifully.','Garnish with a cocktail cherry.']},
'Рамос джин физз':{ru:['Налейте в шейкер: джин 45 мл, сливки 60 мл, сахарный сироп 30 мл, лимонный сок 15 мл, сок лайма 15 мл, яичный белок и 3 капли воды апельсинового цвета.','Встряхивайте без льда 15–20 секунд (сухой шейк), чтобы белок и сливки взбились.','Добавьте лёд и встряхивайте очень долго и энергично — 1–2 минуты. Это главный секрет пышной шапки.','Процедите коктейль в охлаждённый хайбол без льда.','Дайте пене постоять 1 минуту.','Медленно долейте содовую по центру — пена поднимется над краем бокала.','Подавайте с трубочкой.'],en:['Pour into the shaker: gin 45 ml, cream 60 ml, simple syrup 30 ml, lemon juice 15 ml, lime juice 15 ml, the egg white and 3 drops of orange flower water.','Shake without ice for 15–20 seconds (dry shake) to whip the egg white and cream.','Add ice and shake very long and hard — 1–2 minutes. This is the secret of the tall foam head.','Strain into a chilled highball without ice.','Let the foam rest for 1 minute.','Slowly top up with soda water poured into the centre — the foam will rise above the rim.','Serve with a straw.']},
'Шампанский коктейль':{ru:['Положите кусочек сахара на салфетку и капните на него 2 дэша ангостуры, чтобы он пропитался.','Положите сахар на дно охлаждённого флюте.','Налейте коньяк 10 мл.','Медленно долейте охлаждённое шампанское 90 мл — сахар будет давать дорожку пузырьков.','Украсьте цедрой апельсина и подавайте.'],en:['Put a sugar cube on a napkin and soak it with 2 dashes of Angostura.','Drop the sugar cube into a chilled flute.','Add 10 ml of cognac.','Slowly top up with 90 ml of chilled champagne — the sugar will send up a stream of bubbles.','Garnish with an orange twist and serve.']},
'Гарибальди':{ru:['Взбейте апельсиновый сок 120 мл в блендере 10 секунд до пышной пены (или используйте свежевыжатый сок из соковыжималки).','Наполните хайбол льдом.','Налейте красный биттер 45 мл.','Долейте взбитый апельсиновый сок — он ляжет пышной шапкой.','Украсьте долькой апельсина.'],en:['Blend 120 ml of orange juice for 10 seconds until frothy (or use juice straight from a juicer).','Fill a highball with ice.','Pour in 45 ml of red bitter.','Top with the frothy orange juice — it will form a fluffy head.','Garnish with an orange slice.']},
'Хорс нек':{ru:['Срежьте с лимона цедру одной длинной спиралью.','Опустите спираль в хайбол так, чтобы один конец свисал через край.','Наполните бокал льдом, придерживая цедру.','Налейте коньяк 40 мл и, по желанию, 2 дэша ангостуры.','Долейте имбирный эль 120 мл и слегка перемешайте.'],en:['Cut the lemon peel off in one long spiral.','Put the spiral into a highball with one end hanging over the rim.','Fill the glass with ice, holding the peel in place.','Pour in 40 ml of cognac and, if you like, 2 dashes of Angostura.','Top with 120 ml of ginger ale and stir gently.']},
'Брамбл':{ru:['Наполните рокс колотым льдом.','Налейте в шейкер: джин 50 мл, лимонный сок 25 мл, сахарный сироп 12 мл.','Наполните шейкер льдом и встряхивайте 10–12 секунд.','Процедите коктейль в рокс на колотый лёд.','Медленно полейте сверху ежевичный ликёр 15 мл — он красиво растечётся по льду.','Досыпьте льда горкой и украсьте ежевикой и долькой лимона.'],en:['Fill a rocks glass with crushed ice.','Pour into the shaker: gin 50 ml, lemon juice 25 ml, simple syrup 12 ml.','Fill the shaker with ice and shake for 10–12 seconds.','Strain the cocktail over the crushed ice.','Slowly drizzle 15 ml of crème de mûre over the top so it bleeds through the ice.','Top with more crushed ice and garnish with a blackberry and a lemon slice.']},
'Канчанчара':{ru:['Налейте в рокс (или глиняную чашку) мёд 15 мл, сок лайма 15 мл и воду 50 мл.','Размешайте барной ложкой, пока мёд полностью не растворится.','Наполните бокал льдом.','Налейте светлый ром 60 мл и перемешайте.','Украсьте долькой лайма.'],en:['Pour 15 ml of honey, 15 ml of lime juice and 50 ml of water into a rocks glass (or a clay cup).','Stir with a bar spoon until the honey has fully dissolved.','Fill the glass with ice.','Add 60 ml of light rum and stir.','Garnish with a lime wedge.']},
'IBA Тики':{ru:['Наполните высокий тики-бокал или хайбол колотым льдом.','Положите в шейкер тонкий ломтик имбиря и разомните его мадлером.','Налейте в шейкер: ананасовый сок 90 мл, выдержанный ром 30 мл, дымный ром 30 мл, пюре маракуйи 30 мл, сок лайма 30 мл, амаретто 15 мл, франжелико 5 мл и 5 капель мараскино.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Процедите коктейль двойной фильтрацией в бокал на колотый лёд.','Украсьте дольками цитрусовых и сушёным ананасом.'],en:['Fill a tall tiki glass or highball with crushed ice.','Put a thin slice of ginger into the shaker and muddle it.','Pour into the shaker: pineapple juice 90 ml, aged rum 30 ml, smoky rum 30 ml, passion fruit purée 30 ml, lime juice 30 ml, amaretto 15 ml, Frangelico 5 ml and 5 drops of maraschino.','Fill the shaker with ice and shake hard for 12–15 seconds.','Double strain over the crushed ice.','Garnish with citrus wheels and a dried pineapple slice.']},
'Нью-Йорк сауэр':{ru:['Наполните рокс льдом.','Налейте в шейкер: ржаной виски 60 мл, лимонный сок 30 мл, сахарный сироп 22 мл и, по желанию, яичный белок.','Если добавили белок — сначала встряхните без льда 10 секунд.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Процедите коктейль в рокс со льдом.','Медленно налейте красное вино 30 мл по барной ложке над поверхностью — оно ляжет красным слоем сверху.','Не перемешивайте и подавайте.'],en:['Fill a rocks glass with ice.','Pour into the shaker: rye whiskey 60 ml, lemon juice 30 ml, simple syrup 22 ml and, if you like, the egg white.','If using egg white, dry shake without ice for 10 seconds first.','Fill the shaker with ice and shake hard for 12–15 seconds.','Strain the cocktail into the rocks glass over ice.','Slowly pour 30 ml of red wine over the back of a bar spoon so it floats as a red layer on top.','Do not stir — serve.']},
'Порнстар мартини':{ru:['Охладите купе: наполните его льдом или поставьте в морозилку на 5–10 минут.','Разрежьте маракуйю пополам — одна половинка пойдёт на украшение.','Налейте в шейкер: ванильную водку 45 мл, пюре маракуйи 30 мл, ликёр маракуйи 15 мл, сок лайма 15 мл и ванильный сироп 7 мл.','Наполните шейкер льдом и энергично встряхивайте 12–15 секунд.','Вылейте лёд из купе и процедите коктейль двойной фильтрацией.','Положите половинку маракуйи на поверхность коктейля.','Налейте просекко 60 мл в маленькую стопку и подайте рядом с коктейлем.'],en:['Chill the coupe: fill it with ice or put it in the freezer for 5–10 minutes.','Cut a passion fruit in half — one half is for the garnish.','Pour into the shaker: vanilla vodka 45 ml, passion fruit purée 30 ml, passion fruit liqueur 15 ml, lime juice 15 ml and vanilla syrup 7 ml.','Fill the shaker with ice and shake hard for 12–15 seconds.','Discard the ice from the coupe and double strain the cocktail into it.','Float the passion fruit half on top.','Pour 60 ml of prosecco into a small shot glass and serve it on the side.']},
'Шерри коблер':{ru:['Наполните хайбол колотым льдом.','Положите в шейкер 2 дольки апельсина и слегка разомните их.','Налейте херес амонтильядо 90 мл и сахарный сироп 15 мл.','Добавьте лёд и коротко встряхните 5–8 секунд.','Процедите в бокал на колотый лёд.','Украсьте свежими ягодами и долькой апельсина, подавайте с трубочкой.'],en:['Fill a highball with crushed ice.','Put 2 orange slices into the shaker and press them lightly.','Pour in 90 ml of amontillado sherry and 15 ml of simple syrup.','Add ice and give it a short shake of 5–8 seconds.','Strain over the crushed ice.','Garnish with fresh berries and an orange slice and serve with a straw.']}};

/* Ссылка меню: коктейли кодируются коротким стабильным номером (позиция в общей базе, base36) и числом порций. */
function shareLink(l){return BOT_URL+'?startapp=m_'+[...l.items.entries()].map(([i,k])=>i.toString(36)+'x'+k).join('-')}
function showShare(l){const link=shareLink(l);
openSheet(head(t('shareT'),true)+`<div style="font-size:15px;color:#B9B7D6;line-height:1.6;margin-top:8px">${t('shareD')(esc(l.name))}</div><div style="margin-top:12px;padding:12px;border-radius:12px;background:rgba(220,225,255,.06);font-size:13px;color:#EAD3A6;word-break:break-all">${esc(link)}</div><div style="margin-top:12px;display:flex"><button class="big" id="cp"><i class="ti ti-${tg?'send':'copy'}" aria-hidden="true"></i>${t('copy')}</button></div><div id="cpm" style="font-size:13px;color:#9BDB2E;margin-top:8px;min-height:18px"></div>`);
sheet.querySelector('#back').onclick=showLists;sheet.querySelector('#cp').onclick=()=>{const m=sheet.querySelector('#cpm');if(tg&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t('shareText')+' «'+l.name+'»'));return}try{navigator.clipboard.writeText(link).then(()=>{m.textContent=t('copied')},()=>{m.textContent=t('copyFail')})}catch(e){m.textContent=t('copyFail')}}}
const rowHtml=d=>`<div class="row" data-i="${d.i}"><span style="width:10px;height:10px;border-radius:50%;background:${NC[B[d.b][1]][1]};flex:none"></span><span style="flex:1">${nm(d)}</span><span style="font-size:12px;color:#8E8CAE">${bName(d.b)}</span></div>`;
function showFavs(){const f=[...fav].map(i=>D[i]);openSheet(head(t('favs'))+(f.length?`<div style="margin-top:8px">${f.map(rowHtml).join('')}</div>`:`<div style="font-size:15px;color:#B9B7D6;margin-top:12px;line-height:1.65">${t('favEmpty')}</div>`));bindChips()}
function showSearch(){openSheet(head(t('search'))+`<input class="din" id="q" placeholder="${t('searchPh')}" style="width:100%;margin-top:12px"><div id="res" style="margin-top:6px"></div>`);const q=sheet.querySelector('#q'),res=sheet.querySelector('#res');
const run=()=>{const s=q.value.trim().toLowerCase();if(!s){res.innerHTML=`<div style="font-size:14px;color:#8E8CAE;padding:10px 0">${t('searchHint')}</div>`;return}const f=D.filter(d=>(d.n+'|'+EN[d.n][0]+'|'+d.ings.map(x=>x.a+'|'+(ING_EN[x.a]||'')).join('|')).toLowerCase().includes(s));res.innerHTML=f.length?f.map(rowHtml).join(''):`<div style="font-size:14px;color:#8E8CAE;padding:10px 0">${t('nothing')}</div>`;bindChips()};q.oninput=run;run();setTimeout(()=>q.focus(),260)}
const FL=['can','noEgg','noDairy','batch','mine','zero'];
function showFilters(){const canN=bar.size?D.filter(d=>!missOf(d).length).length:0;
openSheet(head(t('filters'))+`<div style="font-size:14px;color:#9997B8;margin-top:6px">${t('filtHint')}</div><div style="margin-top:12px;display:flex;flex-wrap:wrap">${FL.map(k=>`<button class="tgl${F[k]?' on':''}" data-f="${k}">${t('f_'+k)}</button>`).join('')}</div>${F.can&&!bar.size?`<div style="font-size:13px;color:#FFC2A3;margin-top:2px">${t('barFirst')}</div>`:''}
<div class="lab">${t('myBar')}</div><div style="margin-top:8px;padding:14px;border-radius:16px;background:rgba(220,225,255,.04);border:0.5px solid rgba(220,225,255,.1)"><div style="font-size:15px;line-height:1.55;color:#DCDAF0">${bar.size?t('barStat')(bar.size,canN,plural(canN)):t('barIntro')}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="big" id="barb"><i class="ti ti-bottle" aria-hidden="true"></i>${bar.size?t('barEdit'):t('barSet')}</button>${bar.size?`<button class="sec" id="barc">${t('clear')}</button>`:''}</div></div>
${fCount()?`<div style="margin-top:14px"><button class="sec" id="fr" style="width:100%">${t('reset')}</button></div>`:''}`);
sheet.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F[b.dataset.f]=!F[b.dataset.f];haptic();updCount();showFilters()});
sheet.querySelector('#barb').onclick=showBar;const bc=sheet.querySelector('#barc');if(bc)bc.onclick=()=>{bar.clear();updCount();showFilters()};const fr=sheet.querySelector('#fr');if(fr)fr.onclick=()=>{FL.forEach(k=>F[k]=false);updCount();showFilters()}}
function showBar(){const groups=t('cats').map((c,ci)=>({c,items:ALLING.filter(n=>catOf(n)===ci).sort((a,b)=>ingN(a).localeCompare(ingN(b),lang))})).filter(g=>g.items.length);
openSheet(head(t('myBar'),true)+`<div style="font-size:14px;color:#9997B8;margin-top:6px">${t('marked')}<span id="bn">${bar.size}</span>. ${t('always')}</div>${groups.map(g=>`<div class="lab">${g.c}</div><div style="margin-top:8px;display:flex;flex-wrap:wrap">${g.items.map(n=>`<button class="tgl${bar.has(n)?' on':''}" data-b="${esc(n)}">${esc(ingN(n))}</button>`).join('')}</div>`).join('')}<div style="margin-top:16px;display:flex"><button class="big" id="bd">${t('done')}</button></div>`);
sheet.querySelector('#back').onclick=showFilters;sheet.querySelector('#bd').onclick=showFilters;
sheet.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const n=b.dataset.b;bar.has(n)?bar.delete(n):bar.add(n);b.classList.toggle('on',bar.has(n));sheet.querySelector('#bn').textContent=bar.size;updCount()})}
function showRandom(){let pool=(inGroup&&focus?focus.items:D).filter(passes);if(!pool.length)pool=inGroup&&focus?focus.items:D;showCard(pool[Math.floor(Math.random()*pool.length)])}
function applyStatic(){document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.getElementById('lng').textContent=lang==='ru'?'EN':'RU';document.getElementById('lng0').textContent=lang==='ru'?'English':'Русский';document.documentElement.lang=lang}
function setLang(l){lang=l;applyStatic();fontsOk++;PL.forEach(q=>q._lk=null);hubs.forEach(h=>{h.n=glabel(h.k);h._k=null});lastHdr='';if(cardOpen)closeSheet();updCount();haptic('sel')}
document.getElementById('lng').onclick=()=>setLang(lang==='ru'?'en':'ru');document.getElementById('lng0').onclick=()=>setLang(lang==='ru'?'en':'ru');
document.getElementById('favs').onclick=showFavs;document.getElementById('mylists').onclick=showLists;document.getElementById('srch').onclick=showSearch;document.getElementById('rnd').onclick=showRandom;document.getElementById('flt').onclick=showFilters;
let ageOk=false;
function hideAge(){ageOk=true;document.getElementById('age').style.display='none';afterAge()}
document.getElementById('age18').onclick=hideAge;
document.getElementById('age0').onclick=()=>{F.zero=true;updCount();hideAge()};
function step(dir){const cur=(inGroup&&focus)?focus:frontHub();const ang=h=>{const r=mv(M,h.tgt);return Math.atan2(r[0],r[2])};const a0=ang(cur);const others=hubs.filter(h=>h!==cur).map(h=>{let d=ang(h)-a0;while(d<=0)d+=2*Math.PI;return{h,d}}).sort((a,b)=>a.d-b.d);const pick=dir>0?others[0]:others[others.length-1];if(!pick)return;focus=pick.h;tilt=[0,0];wx=wy=0;haptic('sel')}
document.getElementById('ig').onclick=e=>{if(tg&&tg.openLink){e.preventDefault();tg.openLink('https://www.instagram.com/ne.drozd/')}};
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;build()});
window.addEventListener('resize',()=>{size();fontsOk++;PL.forEach(q=>q._lk=null)});
applyStatic();size();build();updCount();requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{fontsOk++;PL.forEach(q=>q._lk=null)});
/* ===== Сохранение: у каждого пользователя свои данные =====
   В Telegram — CloudStorage (привязано к аккаунту и боту, синхронизируется между устройствами).
   В обычном браузере — localStorage. Коктейли сохраняются по названию, чтобы порядок базы можно было менять. */
const KEYS=['wtd_prefs','wtd_fav','wtd_bar','wtd_lists','wtd_notes'];const CHUNK=3900;
const BYNAME=new Map(D.map(d=>[d.n,d]));
const useCloud=!!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'));
const cs={
get(keys){return new Promise(res=>{if(!useCloud){const o={};keys.forEach(k=>{try{o[k]=localStorage.getItem(k)||''}catch(e){o[k]=''}});return res(o)}
try{tg.CloudStorage.getItems(keys,(err,v)=>res(err||!v?{}:v))}catch(e){res({})}})},
set(k,v){return new Promise(res=>{if(!useCloud){try{v===''?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}return res()}
try{v===''?tg.CloudStorage.removeItem(k,()=>res()):tg.CloudStorage.setItem(k,v,()=>res())}catch(e){res()}})}};
async function readKey(k){const a=(await cs.get([k]))[k]||'';if(!a.startsWith('#'))return a;const n=+a.slice(1)||0;if(!n)return'';const ks=[...Array(n)].map((_,j)=>k+'_p'+j);const v=await cs.get(ks);return ks.map(x=>v[x]||'').join('')}
const prevLen={};
async function writeKey(k,s){if(s.length<=CHUNK){await cs.set(k,s);}else{const parts=[];for(let j=0;j<s.length;j+=CHUNK)parts.push(s.slice(j,j+CHUNK));for(let j=0;j<parts.length;j++)await cs.set(k+'_p'+j,parts[j]);await cs.set(k,'#'+parts.length);
for(let j=parts.length;j<(prevLen[k]||0);j++)await cs.set(k+'_p'+j,'');prevLen[k]=parts.length;return}
for(let j=0;j<(prevLen[k]||0);j++)await cs.set(k+'_p'+j,'');prevLen[k]=0}
function snap(){return{
wtd_prefs:JSON.stringify({lang,age:ageOk?1:0,F}),
wtd_fav:JSON.stringify([...fav].map(i=>D[i].n)),
wtd_bar:JSON.stringify([...bar]),
wtd_lists:JSON.stringify(lists.map(l=>({id:l.id,name:l.name,def:l.def,items:[...l.items.entries()].map(([i,k])=>[D[i].n,k])}))),
wtd_notes:JSON.stringify(Object.fromEntries(Object.entries(notes).filter(([,v])=>v).map(([i,v])=>[D[i].n,v])))}}
let saved={},loaded=false,saving=false;
async function saveNow(){if(!loaded||saving)return;saving=true;try{const s=snap();for(const k of KEYS){if(s[k]!==saved[k]){await writeKey(k,s[k]);saved[k]=s[k]}}}finally{saving=false}}
setInterval(saveNow,1200);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
window.addEventListener('pagehide',saveNow);
const pj=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}};
async function loadAll(){const v={};for(const k of KEYS)v[k]=await readKey(k);
const p=pj(v.wtd_prefs,{});if(p.lang==='ru'||p.lang==='en')lang=p.lang;if(p.F)Object.keys(F).forEach(k=>{F[k]=!!p.F[k]});
pj(v.wtd_fav,[]).forEach(n=>{const d=BYNAME.get(n);if(d)fav.add(d.i)});
pj(v.wtd_bar,[]).forEach(n=>bar.add(n));
lists=pj(v.wtd_lists,[]).map(l=>({id:+l.id||0,name:String(l.name||'').slice(0,40)||'—',def:clamp(+l.def||4,1,99),shop:false,items:new Map((l.items||[]).map(([n,k])=>[BYNAME.get(n),clamp(+k||1,1,99)]).filter(([d])=>d).map(([d,k])=>[d.i,k]))}));
lid=Math.max(0,...lists.map(l=>l.id))+1;
Object.entries(pj(v.wtd_notes,{})).forEach(([n,txt])=>{const d=BYNAME.get(n);if(d&&txt)notes[d.i]=String(txt)});
saved=snap();KEYS.forEach(k=>{if((v[k]||'')==='')saved[k]=''});loaded=true;return !!p.age}
/* ===== Открытие по ссылке «Поделиться»: t.me/whattodrinkuh_bot/app?startapp=m_… ===== */
function startParam(){let s='';try{s=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||''}catch(e){}if(!s){const q=new URLSearchParams(location.search);s=q.get('tgWebAppStartParam')||q.get('startapp')||''}return s}
let pendingMenu=null;(()=>{const s=startParam();if(!/^m_[0-9a-z]+x\d+(-[0-9a-z]+x\d+)*$/.test(s))return;const items=new Map();s.slice(2).split('-').forEach(p=>{const[a,b]=p.split('x');const i=parseInt(a,36);if(D[i])items.set(i,clamp(+b||1,1,99))});if(items.size)pendingMenu=items})();
function sameItems(a,b){if(a.size!==b.size)return false;for(const[k,v]of a)if(b.get(k)!==v)return false;return true}
function afterAge(){if(!pendingMenu||!loaded)return;const items=pendingMenu;pendingMenu=null;
if(!lists.some(l=>sameItems(l.items,items))){const vals=[...items.values()];lists.push({id:lid++,name:t('sharedList'),items,shop:false,def:vals.every(v=>v===vals[0])?vals[0]:4})}
updCount();showLists()}
loadAll().then(age=>{applyStatic();hubs.forEach(h=>{h.n=glabel(h.k);h._k=null});lastHdr='';fontsOk++;PL.forEach(q=>q._lk=null);updCount();if(age||ageOk)hideAge()}).catch(()=>{loaded=true});
</script>
